name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar o programa e as dependências de desenvolvimento
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: Rodar os testes (offline)
        run: pytest

  instalacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar num ambiente limpo
        run: |
          python -m venv /tmp/limpo
          /tmp/limpo/bin/pip install .
      # Fora da pasta do repositório, para usar só o que foi instalado
      - name: Conferir o comando sapyl
        working-directory: /tmp
        run: |
          /tmp/limpo/bin/sapyl --version
          /tmp/limpo/bin/python -m sapyl --version
