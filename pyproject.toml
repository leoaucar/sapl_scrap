[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sapyl"
version = "0.2.0"
description = "SAPyL: Raspador do Sistema de Apoio Legislativo"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Leonardo Nogueira Aucar" },
    { name = "Renata Aquino" },
    { name = "Fernanda Moura" },
]
dependencies = [
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
# O comando passa a funcionar quando o pacote ganha a interface (T06)
sapyl = "sapyl.interface.principal:executar"

[project.urls]
Repositorio = "https://github.com/leoaucar/sapl_scrap"

[tool.setuptools.packages.find]
include = ["sapyl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*_proj", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
